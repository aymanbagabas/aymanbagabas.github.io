{{- $w := default "" (.Get "width") -}}
{{- $h := default "" (.Get "height") -}}
{{- $align := default "" (.Get "align") -}}
{{- $alt := default "" (.Get "alt") -}}
{{- $src := .Get "src" -}}
<figure{{ with $align }} class="figure-{{ . }}"{{ end }}>
  <img src="{{ $src }}" alt="{{ $alt }}"{{ with $w }} width="{{ . }}"{{ end }}{{ with $h }} height="{{ . }}"{{ end }}>
  {{ with .Get "caption" }}<figcaption>{{ . | safeHTML }}</figcaption>{{ end }}
</figure>
