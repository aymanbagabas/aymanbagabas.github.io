<div class="post-meta">
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z0700" }}" class="post-date">{{ .Date.Format (default "January 2, 2006" .Site.Params.dateFormat) }}</time>
  {{ with .ReadingTime }} &bull; <span class="post-ttr">{{ . }} min read</span>{{ end }}
  {{ with .Params.tags }}
    &bull;
    <span class="post-tags">
      {{ range $i, $t := . }}{{ if $i }}, {{ end }}<a href="{{ "/tags/" | relURL }}{{ $t | urlize }}/">{{ $t }}</a>{{ end }}
    </span>
  {{ end }}
</div>
