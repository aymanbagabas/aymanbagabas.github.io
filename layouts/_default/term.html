{{ define "main" }}
<h1 class="page-title">#{{ .Title }}</h1>
<ul class="articles-list">
  {{ range .Pages.ByDate.Reverse }}
  <li class="articles-item">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
