{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
<input type="search" id="search-input" class="search-input" placeholder="Search posts…" autofocus>
<ul id="search-results" class="articles-list"></ul>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
(async function () {
  const res = await fetch('/index.json');
  const docs = await res.json();
  const fuse = new Fuse(docs, { keys: ['title', 'tags', 'content'], threshold: 0.3, ignoreLocation: true });
  const input = document.getElementById('search-input');
  const out = document.getElementById('search-results');
  function render(results) {
    out.innerHTML = results.map(r => {
      const d = r.item || r;
      return `<li class="articles-item"><a href="${d.url}">${d.title}</a><time>${d.date || ''}</time></li>`;
    }).join('');
  }
  input.addEventListener('input', () => {
    const q = input.value.trim();
    render(q ? fuse.search(q) : docs.map(d => ({ item: d })));
  });
  render(docs.map(d => ({ item: d })));
})();
</script>
{{ end }}
