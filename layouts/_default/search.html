{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
{{ .Content }}

<input id="search-input" type="search" placeholder="Search posts..." aria-label="Search posts" autocomplete="off" autofocus>
<ul id="search-results" class="posts-list"></ul>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" referrerpolicy="no-referrer" crossorigin="anonymous"></script>
<script>
(function () {
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var fuse = null;
  fetch('{{ "/index.json" | relURL }}')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      fuse = new Fuse(data, {
        keys: ['title', 'tags', 'summary', 'content'],
        threshold: 0.4,
        ignoreLocation: true,
      });
    });

  function render(items) {
    results.innerHTML = items.slice(0, 50).map(function (it) {
      var p = it.item || it;
      return '<li><h3><a href="' + p.url + '">' + p.title +
        ' <small>' + p.date + '</small></a></h3></li>';
    }).join('');
  }

  input.addEventListener('input', function () {
    if (!fuse) return;
    var q = input.value.trim();
    if (!q) { results.innerHTML = ''; return; }
    render(fuse.search(q));
  });
})();
</script>
{{ end }}
