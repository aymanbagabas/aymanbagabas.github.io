name: Import content

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Re-import tumblr posts from scratch each run.
      - run: rm -rf _posts/tumblr content/posts/tumblr
      - run: bundle exec ruby _scripts/tumblr-import.rb
      # jekyll-import writes to _posts/tumblr; move into Hugo content tree.
      - run: |
          mkdir -p content/posts/tumblr
          if [ -d _posts/tumblr ]; then
            mv _posts/tumblr/* content/posts/tumblr/ || true
            rm -rf _posts/tumblr
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - run: npm install

      - run: node _scripts/notion-import.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}

      - uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore: update imported posts"
          branch: master
          commit_user_name: "importer-bot 🤖"
          commit_user_email: actions@github.com
          commit_author: "importer-bot 🤖 <actions@github.com>"
