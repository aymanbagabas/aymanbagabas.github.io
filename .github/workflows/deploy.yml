name: Deploy site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: latest
          extended: true

      - name: Fetch GitHub repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh api "users/aymanbagabas/repos?per_page=100&type=owner&sort=updated" --paginate > data/github_repos.json

      - uses: actions/configure-pages@v6

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify

      - name: Preserve legacy feed URLs
        run: |
          mkdir -p public/blog
          cp public/posts/index.xml public/posts/feed.xml
          cp public/posts/index.xml public/blog/index.xml
          cp public/posts/index.xml public/blog/feed.xml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
